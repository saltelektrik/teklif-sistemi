<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Teklif Sistemi Demo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
    }
    h1 {
      color: #333;
    }
    p {
      color: #666;
    }
    a.button {
      display: inline-block;
      background: #007bff;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      margin: 5px;
      transition: background 0.2s;
    }
    a.button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <div class="container">
    {% if user %}
      <h1>Hoş geldin, {{ user.name }}</h1>
      <p>Ne yapmak istersin?</p>
      <a href="/dashboard" class="button">📋 Panel</a>
      <a href="/logout" class="button" style="background:#dc3545;">🚪 Çıkış</a>
    {% else %}
      <h1>Teklif Sistemi</h1>
      <p>Talep oluşturmak için giriş yap veya kayıt ol.</p>
      <a href="/login" class="button">🔑 Giriş Yap</a>
      <a href="/register" class="button">📝 Kayıt Ol</a>
    {% endif %}
  </div>
</body>
</html>
