<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yönetici Hesabı</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 80%;
      max-width: 600px;
      margin: 60px auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 30px;
    }

    h1 {
      font-size: 24px;
      color: #111827;
      margin-bottom: 20px;
      border-bottom: 2px solid #2563eb;
      padding-bottom: 10px;
    }

    .info {
      font-size: 16px;
      margin-bottom: 12px;
      color: #333;
    }

    .label {
      font-weight: bold;
      color: #2563eb;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      background: #2563eb;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      text-decoration: none;
    }

    a:hover {
      background: #1e40af;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>👤 Yönetici Hesabı</h1>

    <div class="info"><span class="label">Ad Soyad:</span> {{ user.name }}</div>
    <div class="info"><span class="label">E-posta:</span> {{ user.email }}</div>
    <div class="info"><span class="label">Rol:</span> {{ user.role|capitalize }}</div>

    <a href="/admin/dashboard">⬅️ Panele Dön</a>
  </div>
</body>
</html>
