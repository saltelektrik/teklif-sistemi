{% extends "admin/base_admin.html" %}

{% block title %}Yönetici Girişi{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gray-50">
  <div class="bg-white shadow-md rounded-2xl p-8 w-full max-w-sm">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">🔐 Yönetici Girişi</h2>
      <p class="text-gray-500 text-sm mt-1">Yönetici paneline erişmek için giriş yapın</p>
    </div>

    <form action="/admin/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">E-posta</label>
        <input
          type="email"
          name="email"
          placeholder="admin@saltelektrik.com"
          required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Şifre</label>
        <input
          type="password"
          name="password"
          placeholder="••••••••"
          required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none"
        >
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition text-sm font-medium"
      >
        Giriş Yap
      </button>
    </form>
  </div>
</div>
{% endblock %}
