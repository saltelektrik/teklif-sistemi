{% extends "client/base_client.html" %}

{% block title %}Müşteri Paneli{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-gray-800 mb-6">Merhaba, {{ user.name }}</h1>

<!-- Yeni Talep Gönder -->
<div class="bg-white rounded-xl shadow-sm p-6 mb-8">
  <h3 class="text-lg font-semibold text-gray-800 mb-4">Yeni Talep Gönder</h3>

  <form action="/submit" method="POST" enctype="multipart/form-data" class="space-y-4">
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left text-gray-700 border border-gray-100 rounded-lg">
        <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
          <tr>
            <th class="px-3 py-2">Açıklama</th>
            <th class="px-3 py-2">Ürün Kodu</th>
            <th class="px-3 py-2">Marka</th>
            <th class="px-3 py-2">Miktar</th>
            <th class="px-3 py-2">Sil</th>
          </tr>
        </thead>
        <tbody id="product-rows">
          <tr class="border-t">
            <td class="px-3 py-2"><input type="text" name="desc[]" class="input border-gray-300 rounded-lg w-full px-2 py-1" /></td>
            <td class="px-3 py-2"><input type="text" name="code[]" class="input border-gray-300 rounded-lg w-full px-2 py-1" /></td>
            <td class="px-3 py-2"><input type="text" name="brand[]" class="input border-gray-300 rounded-lg w-full px-2 py-1" /></td>
            <td class="px-3 py-2"><input type="text" name="qty[]" class="input border-gray-300 rounded-lg w-full px-2 py-1" /></td>
            <td class="px-3 py-2 text-center">
              <button type="button" class="text-red-600 hover:text-red-800" onclick="this.closest('tr').remove()">✕</button>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- ✅ Ürün Ekle Butonu -->
      <div class="mt-3">
        <button type="button" onclick="addProductRow()" class="bg-blue-600 text-white text-sm px-4 py-1.5 rounded-lg hover:bg-blue-700">
          + Ürün Ekle
        </button>
      </div>
    </div>

    <div>
      <textarea
        name="message"
        placeholder="Ek notlarınızı buraya yazabilirsiniz..."
        class="w-full h-28 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none"
      ></textarea>
    </div>

    <div>
      <label class="font-medium text-gray-700">📷 Fotoğraf Ekle</label><br>
      <input type="file" name="photo" accept="image/*" class="mt-2 text-sm text-gray-700">
    </div>

    <button
      type="submit"
      class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition text-sm font-medium"
    >
      Gönder
    </button>
  </form>
</div>

<!-- JS: Dinamik ürün satırı ekleme -->
<script>
function addProductRow() {
  const tableBody = document.getElementById("product-rows");
  const newRow = document.createElement("tr");
  newRow.className = "border-t";
  newRow.innerHTML = `
    <td class="px-3 py-2"><input type="text" name="desc[]" class="input border-gray-300 rounded-lg w-full px-2 py-1" /></td>
    <td class="px-3 py-2"><input type="text" name="code[]" class="input border-gray-300 rounded-lg w-full px-2 py-1" /></td>
    <td class="px-3 py-2"><input type="text" name="brand[]" class="input border-gray-300 rounded-lg w-full px-2 py-1" /></td>
    <td class="px-3 py-2"><input type="text" name="qty[]" class="input border-gray-300 rounded-lg w-full px-2 py-1" /></td>
    <td class="px-3 py-2 text-center">
      <button type="button" class="text-red-600 hover:text-red-800" onclick="this.closest('tr').remove()">✕</button>
    </td>
  `;
  tableBody.appendChild(newRow);
}
</script>

<!-- Geçmiş Talepler -->
<div class="bg-white rounded-xl shadow-sm p-6">
  <h3 class="text-lg font-semibold text-gray-800 mb-4">Geçmiş Taleplerim</h3>
  ...
</div>
{% endblock %}
