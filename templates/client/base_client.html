<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Teklif Sistemi{% endblock %}</title>

  <!-- TailwindCSS + Flowbite -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>

  <!-- (İstersen eski style.css dosyanı koruyabilirsin) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow-md p-6 flex flex-col justify-between">
    <div>
      <h2 class="text-xl font-bold text-blue-600 mb-6">📋 Teklif Sistemi</h2>

      {% if user %}
        <div class="mb-4">
          <p class="font-medium text-gray-700">{{ user.name }}</p>
        </div>

        <nav>
          <ul class="space-y-2">

            <li>
              <a href="{{ url_for('dashboard') }}" 
                 class="block px-3 py-2 rounded-lg hover:bg-blue-100 {% if request.path == url_for('dashboard') %}bg-blue-100 font-semibold{% endif %}">
                🏠 Ana Sayfa
              </a>
            </li>

            <!-- ✅ Yeni Hesabım menü öğesi -->
            <li>
              <a href="{{ url_for('account') }}" 
                 class="block px-3 py-2 rounded-lg hover:bg-blue-100 {% if request.path == url_for('account') %}bg-blue-100 font-semibold{% endif %}">
                👤 Hesabım
              </a>
            </li>

            <li>
              <a href="/logout" class="block px-3 py-2 rounded-lg hover:bg-blue-100">🚪 Oturumu Kapat</a>
            </li>

          </ul>
        </nav>
      {% endif %}
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 p-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
